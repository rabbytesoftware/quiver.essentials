# Shape: a CLI tool published as one archive per platform (tar.gz / zip).
# Real upstream: https://github.com/junegunn/fzf/releases/tag/v0.74.4
#
# Why it looks like this:
# - One "*" target: the recipe is identical everywhere; only the URL and the
#   checksum differ per platform, so they are Overrideable maps with one exact
#   key per supported GOOS/GOARCH (coverage must reach every platform "*"
#   matches, or have a default).
# - `extract` detects tar vs zip from content, so one step serves all six.
# - Install-only (no `uninstall:`) is valid because every install step writes
#   inside ${INSTALL_PATH}: removing the workdir already undoes it.
# - `expose.cli` with `path: auto` finds the extracted executable: on macOS
#   and Linux `fzf` is linked into ~/.quiver/bin; on Windows the folder holding
#   `fzf.exe` is appended to the user's Path.
schema: "arrow@v0"

metadata:
  name: junegunn.fzf
  description: A command-line fuzzy finder
  license: MIT
  url: https://github.com/junegunn/fzf
  credits:
    - name: Junegunn Choi
      url: https://github.com/junegunn
  tags:
    - cli
    - search

targets:
  "*":
    requirements:
      cpu_cores: 1
      ram_gb: 1
      disk_gb: 1

    lifecycle:
      install:
        - type: fetch
          title: Download fzf
          url:
            linux/amd64: https://github.com/junegunn/fzf/releases/download/v0.74.4/fzf-0.74.4-linux_amd64.tar.gz
            linux/arm64: https://github.com/junegunn/fzf/releases/download/v0.74.4/fzf-0.74.4-linux_arm64.tar.gz
            darwin/amd64: https://github.com/junegunn/fzf/releases/download/v0.74.4/fzf-0.74.4-darwin_amd64.tar.gz
            darwin/arm64: https://github.com/junegunn/fzf/releases/download/v0.74.4/fzf-0.74.4-darwin_arm64.tar.gz
            windows/amd64: https://github.com/junegunn/fzf/releases/download/v0.74.4/fzf-0.74.4-windows_amd64.zip
            windows/arm64: https://github.com/junegunn/fzf/releases/download/v0.74.4/fzf-0.74.4-windows_arm64.zip
          checksum:
            linux/amd64: 05e6813a337cc722c3ed07e54a764b75cc5d671e2e60459db0ba696ee5fa7504
            linux/arm64: 5d673b849f494f0d64ec471d8640b153ca8849e3846a31da17abdcfce8df6b46
            darwin/amd64: 2d392b50be66e2ab104ccd52a6072df692b1f9b9c5b449a9c098de885f32c4c5
            darwin/arm64: 4f6a113bfc0c7959e0005c78d566a51afc4fcefc956f43735c62a9deb19e92ae
            windows/amd64: 5e63c0e798406fcb9c51a9fed4988398e25fdabf8c670e32c16caf7b4a7ed02d
            windows/arm64: 558df4dac9c65a63c732909a06abc1891a42adcae4d6be92a9b0ccc0ef05b4ff
          to: ${INSTALL_PATH}/.fzf.download
          timeout: 5m

        - type: extract
          title: Unpack fzf
          from: ${INSTALL_PATH}/.fzf.download
          to: ${INSTALL_PATH}/bin
          timeout: 2m

    expose:
      cli:
        - name: fzf
          path: auto
