<text x="24" y="174" fill="#D4D4D4">const&#160;os&#160;=&#160;require(&quot;node:os&quot;);</text>
<text x="24" y="196" fill="#D4D4D4">console.log(`Hello&#160;from&#160;Node.js&#160;${process.version}&#160;on&#160;${os.platform()}/${os.arch()}`);</text>
